<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>FAQ</h1>
    <div class="faq-item">
      <button class="faq-question" aria-expanded="false" aria-controls="answer-1">
        What is DOM? <span aria-hidden="true">+</span>
      </button>
      <div class="faq-answer" id="answer-1" aria-hidden="true">
        <div><p>DOM stands for Document Object Model. It represents a webpage as a tree of objects.</p></div>
      </div>
    </div>
    <div class="faq-item">
      <button class="faq-question" aria-expanded="false" aria-controls="answer-2">
        What is querySelector()? <span aria-hidden="true">+</span>
      </button>
      <div class="faq-answer" id="answer-2" aria-hidden="true">
        <div><p>It selects the first element that matches a CSS selector.</p></div>
      </div>
    </div>
    <div class="faq-item">
      <button class="faq-question" aria-expanded="false" aria-controls="answer-3">
        What is addEventListener()? <span aria-hidden="true">+</span>
      </button>
      <div class="faq-answer" id="answer-3" aria-hidden="true">
        <div><p>It registers a function to run when a specified event occurs.</p></div>
      </div>
    </div>
    <div class="faq-item">
      <button class="faq-question" aria-expanded="false" aria-controls="answer-4">
        What is Event Bubbling? <span aria-hidden="true">+</span>
      </button>
      <div class="faq-answer" id="answer-4" aria-hidden="true">
        <div><p>It is the way an event travels from its target up through its ancestors.</p></div>
      </div>
    </div>
  </main>
</body>
</html>
